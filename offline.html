<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - PasirPogorCell</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #050505;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            background: #0a0a0a;
            border: 1px solid #22c55e;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 0 40px rgba(34,197,94,0.2);
        }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { color: #22c55e; font-size: 24px; margin-bottom: 10px; }
        p { color: #9ca3af; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        .btn {
            background: #22c55e;
            color: black;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
        }
        .btn:hover { background: #4ade80; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📶</div>
        <h1>Koneksi Terputus</h1>
        <p>Sepertinya kamu sedang offline.<br>
        Coba periksa koneksi internetmu atau<br>
        kembali lagi nanti.</p>
        <a href="/" class="btn">🔄 Coba Lagi</a>
        <p style="margin-top: 20px; font-size: 12px; color: #6b7280;">
            Beberapa data mungkin sudah tersimpan di cache.
        </p>
    </div>
</body>
</html>
